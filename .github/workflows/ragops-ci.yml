name: RAGOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.9.1
        ports:
          - 6333:6333
          - 6334:6334

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        python -m pytest -v
      env:
        QDRANT_URL: http://localhost:6333

    - name: Run Ingestion Pipeline
      run: |
        python -m scripts.ingest
      env:
        QDRANT_URL: http://localhost:6333

    - name: Run RAG Evaluation & Regression Check
      env:
        QDRANT_URL: http://localhost:6333
      run: |
        python -m scripts.evaluate --mock

